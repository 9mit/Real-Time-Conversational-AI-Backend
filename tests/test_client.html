<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #000000;
            font-size: 2em;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #666666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border: 1px solid #000000;
            margin-bottom: 20px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #000000;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #cccccc;
            transition: background 0.3s;
        }

        .status-dot.connected {
            background: #000000;
        }

        .btn {
            padding: 10px 24px;
            border: 2px solid #000000;
            background: #ffffff;
            color: #000000;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #000000;
            color: #ffffff;
        }

        .btn.btn-disconnect {
            background: #000000;
            color: #ffffff;
        }

        .btn.btn-disconnect:hover {
            background: #ffffff;
            color: #000000;
        }

        .chat-container {
            background: #ffffff;
            border: 1px solid #000000;
            padding: 20px;
            height: 450px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px 16px;
            border: 1px solid #000000;
            max-width: 85%;
            color: #000000;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background: #000000;
            color: #ffffff;
            margin-left: auto;
            text-align: right;
        }

        .message.ai {
            background: #ffffff;
            border: 1px solid #000000;
        }

        .message.system {
            background: #f5f5f5;
            color: #666666;
            text-align: center;
            max-width: 100%;
            font-size: 0.9em;
            border: 1px solid #cccccc;
        }

        .message-label {
            font-size: 0.75em;
            opacity: 0.7;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #000000;
            background: #ffffff;
            color: #000000;
            font-size: 16px;
        }

        #messageInput:focus {
            outline: none;
            border-color: #000000;
        }

        #messageInput::placeholder {
            color: #999999;
        }

        .btn-send {
            background: #000000;
            color: #ffffff;
            padding: 15px 30px;
            border: 2px solid #000000;
        }

        .btn-send:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn-send:disabled,
        #messageInput:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .examples {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #000000;
        }

        .examples h3 {
            margin-bottom: 15px;
            color: #000000;
            font-size: 1em;
            font-weight: 600;
        }

        .example-btn {
            background: #ffffff;
            color: #000000;
            padding: 8px 16px;
            margin: 5px;
            border: 1px solid #000000;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
        }

        .example-btn:hover {
            background: #000000;
            color: #ffffff;
        }

        .typing-indicator {
            display: inline-block;
            color: #666666;
            font-style: italic;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                max-width: 100%;
            }

            .status-bar {
                padding: 12px 14px;
            }

            .chat-container {
                height: 380px;
                padding: 14px;
            }

            .message {
                max-width: 90%;
                padding: 10px 12px;
            }

            .btn-send {
                padding: 12px 18px;
            }

            #messageInput {
                padding: 12px 14px;
                font-size: 15px;
            }

            .example-btn {
                padding: 6px 12px;
                margin: 3px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>ARIA</h1>
        <p class="subtitle">AI Assistant</p>

        <div class="status-bar">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <button class="btn" id="connectBtn" onclick="toggleConnection()">Connect</button>
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)"
                disabled>
            <button class="btn btn-send" id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </div>

        <div class="examples">
            <h3>Try asking:</h3>
            <button class="example-btn" onclick="setExample('Hello! What can you help me with?')">Hello</button>
            <button class="example-btn" onclick="setExample('What is the weather in Tokyo?')">Weather</button>
            <button class="example-btn" onclick="setExample('Calculate 125 * 48 + 375')">Calculate</button>
            <button class="example-btn" onclick="setExample('Search for Python tutorials')">Search</button>
            <button class="example-btn" onclick="setExample('What time is it?')">Time</button>
        </div>
    </div>

    <script>
        let ws = null;
        let sessionId = 'session-' + Math.random().toString(36).substring(2, 10);
        let currentAiMessage = null;
        let isProcessing = false;
        let pingInterval = null;

        function toggleConnection() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                ws.close();
            } else {
                connect();
            }
        }

        function getWebSocketUrl() {
            const loc = window.location;
            const protocol = loc.protocol === 'https:' ? 'wss:' : 'ws:';
            const defaultHost = 'localhost:5000';
            const host = loc.host && loc.protocol.startsWith('http') ? loc.host : defaultHost;
            return `${protocol}//${host}/ws/session/${sessionId}`;
        }

        function connect() {
            const wsUrl = getWebSocketUrl();
            addMessage('system', 'Connecting...');

            try {
                ws = new WebSocket(wsUrl);
            } catch (err) {
                addMessage('system', 'Unable to initiate connection.');
                return;
            }

            ws.onopen = () => {
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Connected';
                const connectBtn = document.getElementById('connectBtn');
                connectBtn.textContent = 'Disconnect';
                connectBtn.classList.add('btn-disconnect');
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;

                // Remove temporary connecting message
                const messages = document.querySelectorAll('.message.system');
                messages.forEach(msg => {
                    if (msg.textContent === 'Connecting...') {
                        msg.remove();
                    }
                });

                // Periodic ping keepalive every 25 seconds
                if (pingInterval) clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 25000);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Invalid JSON received:', event.data);
                }
            };

            ws.onclose = () => {
                if (pingInterval) {
                    clearInterval(pingInterval);
                    pingInterval = null;
                }
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Disconnected';
                const connectBtn = document.getElementById('connectBtn');
                connectBtn.textContent = 'Connect';
                connectBtn.classList.remove('btn-disconnect');
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                addMessage('system', 'Disconnected');
                currentAiMessage = null;
                isProcessing = false;
                sessionId = 'session-' + Math.random().toString(36).substring(2, 10);
            };

            ws.onerror = (error) => {
                addMessage('system', 'Connection error');
                console.error('WebSocket error:', error);
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'system':
                    addMessage('system', data.content || 'Ready');
                    break;

                case 'pong':
                    // Keepalive pong received
                    break;

                case 'ai_chunk':
                    if (!currentAiMessage) {
                        currentAiMessage = addMessage('ai', '');
                        isProcessing = false;
                    }
                    appendToMessage(currentAiMessage, data.content);
                    break;

                case 'ai_complete':
                    currentAiMessage = null;
                    isProcessing = false;
                    break;

                case 'tool_call':
                    if (!isProcessing) {
                        isProcessing = true;
                        addMessage('system', 'Fetching information...');
                    }
                    break;

                case 'tool_result':
                    const systemMsgs = document.querySelectorAll('.message.system');
                    systemMsgs.forEach(msg => {
                        if (msg.textContent.includes('Fetching information')) {
                            msg.remove();
                        }
                    });
                    break;

                case 'error':
                    addMessage('system', data.content ? ('Error: ' + data.content) : 'Error occurred');
                    currentAiMessage = null;
                    isProcessing = false;
                    break;
            }

            scrollToBottom();
        }

        function addMessage(type, content) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;

            if (type === 'user' || type === 'ai') {
                const label = type === 'user' ? 'You' : 'ARIA';
                const labelDiv = document.createElement('div');
                labelDiv.className = 'message-label';
                labelDiv.textContent = label;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = content;

                msgDiv.appendChild(labelDiv);
                msgDiv.appendChild(contentDiv);
            } else {
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = content;
                msgDiv.appendChild(contentDiv);
            }

            container.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function appendToMessage(msgDiv, content) {
            if (!msgDiv) return;
            const contentDiv = msgDiv.querySelector('.message-content');
            if (contentDiv) {
                contentDiv.textContent += content;
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;

            addMessage('user', message);

            ws.send(JSON.stringify({
                type: 'user_message',
                content: message
            }));

            input.value = '';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function setExample(text) {
            const input = document.getElementById('messageInput');
            input.value = text;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                connect();
            }
            input.focus();
        }
    </script>
</body>

</html>
